<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>니케 장탄계산기</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .calculator-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        label {
            font-weight: bold;
            color: #555;
            font-size: 14px;
        }
        input, select {
            width: 150px;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 6px;
            text-align: right;
            font-size: 14px;
        }
        input:focus, select:focus {
            border-color: #007bff;
            outline: none;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.3);
        }
        .result-section {
            margin-top: 25px;
            border-top: 2px solid #eee;
            padding-top: 20px;
        }
        .result-group {
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .result-value {
            font-weight: bold;
            font-size: 16px;
            color: #007bff;
        }
    </style>
</head>
<body>

<div class="calculator-container">
    <h2>니케 장탄계산기</h2>
    
    <div class="input-group">
        <label for="baseAmmo">기본 장탄수</label>
        <input type="number" id="baseAmmo" value="0" min="0" oninput="calculate()">
    </div>

    <div class="input-group">
        <label for="collectible">소장품</label>
        <select id="collectible" onchange="calculate()">
            <option value="0">없음 (0%)</option>
            <option value="9.5">적용 (9.5%)</option>
        </select>
    </div>

    <div class="input-group">
        <label for="head">머리 (오버로드)</label>
        <select id="head" onchange="calculate()">
            <option value="0">없음</option>
            <option value="27.84">27.84%</option>
            <option value="31.95">31.95%</option>
            <option value="36.06">36.06%</option>
            <option value="40.17">40.17%</option>
            <option value="44.28">44.28%</option>
            <option value="48.39">48.39%</option>
            <option value="52.5">52.5%</option>
            <option value="56.6">56.6%</option>
            <option value="60.71">60.71%</option>
            <option value="64.82">64.82%</option>
            <option value="68.93">68.93%</option>
            <option value="73.04">73.04%</option>
            <option value="77.15">77.15%</option>
            <option value="81.26">81.26%</option>
            <option value="85.37">85.37%</option> 
        </select>
    </div>

    <div class="input-group">
        <label for="chest">가슴 (오버로드)</label>
        <select id="chest" onchange="calculate()"> 
            <option value="0">없음</option>
            <option value="27.84">27.84%</option>
            <option value="31.95">31.95%</option>
            <option value="36.06">36.06%</option>
            <option value="40.17">40.17%</option>
            <option value="44.28">44.28%</option>
            <option value="48.39">48.39%</option>
            <option value="52.5">52.5%</option>
            <option value="56.6">56.6%</option>
            <option value="60.71">60.71%</option>
            <option value="64.82">64.82%</option>
            <option value="68.93">68.93%</option>
            <option value="73.04">73.04%</option>
            <option value="77.15">77.15%</option>
            <option value="81.26">81.26%</option>
            <option value="85.37">85.37%</option> 
        </select>
    </div>

    <div class="input-group">
        <label for="gloves">장갑 (오버로드)</label>
        <select id="gloves" onchange="calculate()">
            <option value="0">없음</option>
            <option value="27.84">27.84%</option>
            <option value="31.95">31.95%</option>
            <option value="36.06">36.06%</option>
            <option value="40.17">40.17%</option>
            <option value="44.28">44.28%</option>
            <option value="48.39">48.39%</option>
            <option value="52.5">52.5%</option>
            <option value="56.6">56.6%</option>
            <option value="60.71">60.71%</option>
            <option value="64.82">64.82%</option>
            <option value="68.93">68.93%</option>
            <option value="73.04">73.04%</option>
            <option value="77.15">77.15%</option>
            <option value="81.26">81.26%</option>
            <option value="85.37">85.37%</option> 
        </select>
    </div>

    <div class="input-group">
        <label for="legs">다리 (오버로드)</label>
        <select id="legs" onchange="calculate()">
            <option value="0">없음</option>
            <option value="27.84">27.84%</option>
            <option value="31.95">31.95%</option>
            <option value="36.06">36.06%</option>
            <option value="40.17">40.17%</option>
            <option value="44.28">44.28%</option>
            <option value="48.39">48.39%</option>
            <option value="52.5">52.5%</option>
            <option value="56.6">56.6%</option>
            <option value="60.71">60.71%</option>
            <option value="64.82">64.82%</option>
            <option value="68.93">68.93%</option>
            <option value="73.04">73.04%</option>
            <option value="77.15">77.15%</option>
            <option value="81.26">81.26%</option>
            <option value="85.37">85.37%</option> 
        </select>
    </div>

    <div class="result-section">
        <div class="result-group">
            <label>최종 장탄수</label>
            <span id="finalAmmo" class="result-value">0</span>
        </div>
        <div class="result-group">
            <label>탄충 큐브</label>
            <span id="cube" class="result-value">+ 0</span>
        </div>
    </div>
</div>

<script>
function calculate() {
    let base = parseFloat(document.getElementById('baseAmmo').value) || 0;
    let collectible = parseFloat(document.getElementById('collectible').value) || 0;
    let head = parseFloat(document.getElementById('head').value) || 0;
    let chest = parseFloat(document.getElementById('chest').value) || 0;
    let gloves = parseFloat(document.getElementById('gloves').value) || 0;
    let legs = parseFloat(document.getElementById('legs').value) || 0;

    // 엑셀 수식 반영: ROUND(기본장탄 * 비율, 0) 의 합 + 기본장탄
    let addCollectible = Math.round(base * (collectible / 100));
    let addHead = Math.round(base * (head / 100));
    let addChest = Math.round(base * (chest / 100));
    let addGloves = Math.round(base * (gloves / 100));
    let addLegs = Math.round(base * (legs / 100));

    let finalAmmo = Math.round(base + addCollectible + addHead + addChest + addGloves + addLegs);
    let cube = Math.floor(finalAmmo / 10 * 3);

    document.getElementById('finalAmmo').innerText = finalAmmo;
    document.getElementById('cube').innerText = "+ " + cube;
}
</script>

</body>
</html>
